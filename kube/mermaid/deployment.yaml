apiVersion: apps/v1
kind: Deployment
metadata:
  name: mermaid-deployment
  labels:
    app: mermaid
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: mermaid
  template:
    metadata:
      labels:
        app: mermaid
    spec:
      containers:
      - name: mermaid
        image: ghcr.io/mermaid-js/mermaid-live-editor:latest@sha256:1983980bf4a9ef9966b8e067ae94d32af00d98997802bae1e9437f7bee4814cc
        resources:
          requests:
            cpu: "10m"
            memory: "64Mi"
        ports:
          - containerPort: 8080
            protocol: TCP
