apiVersion: v1
kind: Secret
metadata:
  name: affine-secrets
type: Opaque
stringData:
  DATABASE_URL: postgresql://affine:<password>@localhost:5432/affine
  REDIS_SERVER_HOST: localhost
  AFFINE_INDEXER_ENABLED: 'false'
  POSTGRES_USER: affine
  POSTGRES_PASSWORD: <password>
  POSTGRES_DB: affine
  POSTGRES_INITDB_ARGS: '--data-checksums'
