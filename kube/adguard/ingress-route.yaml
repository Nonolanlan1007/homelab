apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: adguard
spec:
  entryPoints:
    - websecure
  tls:
    certResolver: cloudflare
  routes:
    - match: Host(`adguard.lazyduck.fr`)
      kind: Rule
      services:
        - name: adguard
          port: 81
      middlewares:
        - name: internal-only
          namespace: kube-system

---

apiVersion: traefik.io/v1alpha1
kind: IngressRouteUDP
metadata:
  name: adguard
spec:
  entryPoints:
    - dns
  routes:
  - services:
    - name: adguard
      port: 53