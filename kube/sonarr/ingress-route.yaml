apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sonarr
spec:
  entryPoints:
    - websecure
  tls:
    certResolver: cloudflare
  routes:
    - match: Host(`sonarr.lazyduck.fr`)
      kind: Rule
      services:
        - name: sonarr
          port: 8989
      middlewares:
        - name: internal-only
          namespace: kube-system