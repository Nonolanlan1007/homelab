apiVersion: v1
kind: PersistentVolume
metadata:
  name: matrix-data-pv
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - hard
    - nfsvers=4.1
  nfs:
    path: /volume1/Data/matrix-data
    server: 10.0.10.122
