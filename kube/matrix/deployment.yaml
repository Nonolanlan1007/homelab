apiVersion: apps/v1
kind: Deployment
metadata:
  name: matrix-deployment
  labels:
    app: matrix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: matrix
  template:
    metadata:
      labels:
        app: matrix
    spec:
      hostAliases:
      - ip: "127.0.0.1"
        hostnames:
        - "db"
        - "matrix-db-1"
      volumes:
        - name: matrix-db
          persistentVolumeClaim:
            claimName: matrix-db-pvc
        - name: matrix-data
          persistentVolumeClaim:
            claimName: matrix-data-pvc
        - name: well-known-config
          configMap:
            name: matrix-well-known-config
      containers:
      - name: db
        image: docker.io/postgres:17-alpine
        envFrom:
        - secretRef:
            name: matrix-secrets
        volumeMounts:
        - name: matrix-db
          mountPath: /var/lib/postgresql/data
      
      - name: synapse
        image: matrixdotorg/synapse:latest
        envFrom:
        - secretRef:
            name: matrix-secrets
        ports:
        - containerPort: 8008
        volumeMounts:
        - name: matrix-data
          mountPath: /data
      
      - name: nginx-well-known
        image: nginx:alpine
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: well-known-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
