apiVersion: apps/v1
kind: Deployment
metadata:
  name: matrix-deployment
  labels:
    app: matrix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: matrix
  template:
    metadata:
      labels:
        app: matrix
    spec:
      hostAliases:
      - ip: "127.0.0.1"
        hostnames:
        - "db"
        - "matrix-db-1"
      volumes:
        - name: matrix-db
          persistentVolumeClaim:
            claimName: matrix-db-pvc
        - name: matrix-data
          persistentVolumeClaim:
            claimName: matrix-data-pvc
        - name: well-known-config
          configMap:
            name: matrix-well-known-config
      containers:
      - name: db
        image: docker.io/postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        envFrom:
        - secretRef:
            name: matrix-secrets
        volumeMounts:
        - name: matrix-db
          mountPath: /var/lib/postgresql/data
      
      - name: synapse
        image: matrixdotorg/synapse:latest@sha256:1231c84d217f290e73db498f46a9af52aaafa38015502b4ebb7c111c8d097196
        envFrom:
        - secretRef:
            name: matrix-secrets
        ports:
        - containerPort: 8008
        volumeMounts:
        - name: matrix-data
          mountPath: /data
      
      - name: nginx-well-known
        image: nginx:alpine@sha256:72ba65eb42c10344912a84ff42408db7d34f2feb642204570ab8fc5ffd29f1d3
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: well-known-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
