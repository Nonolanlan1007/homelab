apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: matrix-redirect-regex
spec:
  redirectRegex:
    regex: "^https?://lazyduck.fr/(.*)"
    replacement: "https://nolhan.dev/${1}"
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: matrix
spec:
  entryPoints:
    - websecure
  tls:
    certResolver: cloudflare
  routes:
    - match: Host(`matrix.lazyduck.fr`) && (PathPrefix(`/_matrix`) || PathPrefix(`/_synapse`))
      kind: Rule
      services:
        - name: matrix
          port: 8008
    - match: Host(`lazyduck.fr`) && PathPrefix(`/.well-known/matrix/`)
      kind: Rule
      services:
        - name: matrix
          port: 8080
    - match: Host(`lazyduck.fr`)
      kind: Rule
      services:
        - name: matrix
          port: 8080
      middlewares:
        - name: matrix-redirect-regex
