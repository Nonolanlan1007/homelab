apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: harbor
  namespace: harbor-system
spec:
  entryPoints:
    - websecure
  tls:
    certResolver: cloudflare
  routes:
  - match: Host(`harbor.lazyduck.fr`) && (PathPrefix(`/api/`) || PathPrefix(`/service/`) || PathPrefix(`/v2/`) || PathPrefix(`/chartrepo/`) || PathPrefix(`/c/`))
    kind: Rule
    priority: 100
    services:
    - name: harbor-chart-core
      port: 80
  - match: Host(`harbor.lazyduck.fr`)
    kind: Rule
    priority: 10
    services:
    - name: harbor-chart-portal
      port: 80