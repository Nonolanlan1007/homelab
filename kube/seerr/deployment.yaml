apiVersion: apps/v1
kind: Deployment
metadata:
   name: seerr-deployment
   labels:
      app: seerr
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
      matchLabels:
        app: seerr
  template:
    metadata:
      labels:
        app: seerr
    spec:
      volumes:
      - name: "seerr-storage"
        persistentVolumeClaim:
          claimName: seerr-pv-claim
      containers:
      - name: seerr
        image: ghcr.io/seerr-team/seerr:v3.4.1
        resources:
          requests:
            cpu: "20m"
            memory: "256Mi"
        ports:
          - containerPort: 5055
            protocol: TCP        
        volumeMounts:
          - name: seerr-storage
            mountPath: /app/config
        env:
          - name: LOG_LEVEL
            value: 'debug'
          - name: TZ
            value: 'Europe/Paris'
          - name: PORT
            value: '5055'
          - name: FORCE_IPV4_FIRST
            value: 'true'