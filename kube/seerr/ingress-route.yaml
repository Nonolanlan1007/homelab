apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: seerr
spec:
  entryPoints:
    - websecure
  tls:
    certResolver: cloudflare
  routes:
    - match: Host(`seerr.lazyduck.fr`)
      kind: Rule
      services:
        - name: seerr
          port: 5055
      middlewares:
        - name: internal-only
          namespace: kube-system