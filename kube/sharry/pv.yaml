apiVersion: v1
kind: PersistentVolume
metadata:
  name: sharry-data-pv
spec:
  capacity:
    storage: 50Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - hard
    - nfsvers=4.1
  nfs:
    path: /volume1/Data/sharry-data
    server: 10.0.0.122
