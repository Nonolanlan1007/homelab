apiVersion: apps/v1
kind: Deployment
metadata:
   name: flaresolverr-deployment
   labels:
      app: flaresolverr
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
      matchLabels:
        app: flaresolverr
  template:
    metadata:
      labels:
        app: flaresolverr
    spec:
      enableServiceLinks: false
      containers:
      - name: flaresolverr
        image: ghcr.io/flaresolverr/flaresolverr:v3.5.0
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
        ports:
          - containerPort: 8191
            protocol: TCP
          - containerPort: 8192
            protocol: TCP
        env:
          - name: LOG_LEVEL
            value: 'info'
          - name: LOG_HTML
            value: 'false'
          - name: CAPTCHA_SOLVER
            value: 'none'
          - name: TZ
            value: 'Europe/Paris'

