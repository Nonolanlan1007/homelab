apiVersion: v1
kind: PersistentVolume
metadata:
  name: seafile-data-pv
spec:
  capacity:
    storage: 100Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - hard
    - nfsvers=4.1
  nfs:
    path: /volume1/Data/seafile/seafile-data
    server: 10.0.0.122

---

apiVersion: v1
kind: PersistentVolume
metadata:
  name: seadoc-data-pv
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - hard
    - nfsvers=4.1
  nfs:
    path: /volume1/Data/seafile/seadoc-data
    server: 10.0.0.122
