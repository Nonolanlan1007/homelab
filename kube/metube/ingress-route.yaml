apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: metube
spec:
  entryPoints:
    - websecure
  tls:
    certResolver: cloudflare
  routes:
    - match: Host(`metube.lazyduck.fr`)
      kind: Rule
      services:
        - name: metube
          port: 8081
      middlewares:
        - name: internal-only
          namespace: kube-system
