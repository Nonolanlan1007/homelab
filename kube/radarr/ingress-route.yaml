apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: radarr
spec:
  entryPoints:
    - websecure
  tls:
    certResolver: cloudflare
  routes:
    - match: Host(`radarr.lazyduck.fr`)
      kind: Rule
      services:
        - name: radarr
          port: 7878
      middlewares:
        - name: internal-only
          namespace: kube-system