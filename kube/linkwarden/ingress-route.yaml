apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: linkwarden
spec:
  entryPoints:
    - websecure
  tls:
    certResolver: cloudflare
  routes:
    - match: Host(`linkwarden.lazyduck.fr`)
      kind: Rule
      services:
        - name: linkwarden
          port: 3000
      middlewares:
        - name: internal-only
          namespace: kube-system
