apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: immich
spec:
  entryPoints:
    - websecure
  tls:
    certResolver: cloudflare
  routes:
    - match: Host(`immich.lazyduck.fr`)
      kind: Rule
      services:
        - name: immich
          port: 2283
      middlewares:
        - name: internal-only
          namespace: kube-system
