apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-deployment
  labels:
    app: immich
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: immich
  template:
    metadata:
      labels:
        app: immich
    spec:
      enableServiceLinks: false
      volumes:
      - name: local-data
        persistentVolumeClaim:
          claimName: immich-local-pv-claim
      - name: library-data
        persistentVolumeClaim:
          claimName: immich-library-pv-claim
      containers:
      - name: immich-server
        image: ghcr.io/immich-app/immich-server:v3.2.0@sha256:ae13784ffcfcce8f4178113eb6661602a1fd1912f3d539880b8ac0dd95fc8ac2
        resources:
          requests:
            cpu: "40m"
            memory: "1Gi"
        ports:
          - containerPort: 2283
            protocol: TCP
        env:
          - name: DB_HOSTNAME
            value: localhost
          - name: DB_USERNAME
            value: immich
          - name: DB_DATABASE_NAME
            value: immich
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: immich-secrets
                key: DB_PASSWORD
          - name: REDIS_HOSTNAME
            value: localhost
          - name: IMMICH_MACHINE_LEARNING_URL
            value: http://localhost:3003
        volumeMounts:
          - name: library-data
            mountPath: /usr/src/app/upload

      - name: immich-machine-learning
        image: ghcr.io/immich-app/immich-machine-learning:v3.2.0@sha256:f8b2869891c861a58dde969d86e7ea8a186e6059a55886632ee3249e51fb574a
        resources:
          requests:
            cpu: "40m"
            memory: "2Gi"
        volumeMounts:
          - name: local-data
            mountPath: /cache
            subPath: model-cache

      - name: redis
        image: redis:6.2-alpine@sha256:d0c875bdacfb5c4d2c2d9124de3f53cee1dc9ceff8936bd459fabc135cb33015
        resources:
          requests:
            cpu: "10m"
            memory: "64Mi"

      - name: postgres
        image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
        resources:
          requests:
            cpu: "20m"
            memory: "512Mi"
        env:
          - name: POSTGRES_USER
            value: immich
          - name: POSTGRES_DB
            value: immich
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: immich-secrets
                key: DB_PASSWORD
          - name: POSTGRES_INITDB_ARGS
            value: "--data-checksums"
        volumeMounts:
          - name: local-data
            mountPath: /var/lib/postgresql/data
            subPath: postgres
