apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-deployment
  labels:
    app: immich
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich
  template:
    metadata:
      labels:
        app: immich
    spec:
      enableServiceLinks: false
      volumes:
      - name: local-data
        persistentVolumeClaim:
          claimName: immich-local-pv-claim
      - name: library-data
        persistentVolumeClaim:
          claimName: immich-library-pv-claim
      containers:
      - name: immich-server
        image: ghcr.io/immich-app/immich-server:v3.2.2
        resources:
          requests:
            cpu: "40m"
            memory: "1Gi"
        ports:
          - containerPort: 2283
            protocol: TCP
        env:
          - name: DB_HOSTNAME
            value: localhost
          - name: DB_USERNAME
            value: immich
          - name: DB_DATABASE_NAME
            value: immich
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: immich-secrets
                key: DB_PASSWORD
          - name: REDIS_HOSTNAME
            value: localhost
          - name: IMMICH_MACHINE_LEARNING_URL
            value: http://localhost:3003
        volumeMounts:
          - name: library-data
            mountPath: /usr/src/app/upload

      - name: immich-machine-learning
        image: ghcr.io/immich-app/immich-machine-learning:v3.2.0
        resources:
          requests:
            cpu: "40m"
            memory: "2Gi"
        volumeMounts:
          - name: local-data
            mountPath: /cache
            subPath: model-cache

      - name: redis
        image: redis:6.2-alpine
        resources:
          requests:
            cpu: "10m"
            memory: "64Mi"

      - name: postgres
        image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
        resources:
          requests:
            cpu: "20m"
            memory: "512Mi"
        env:
          - name: POSTGRES_USER
            value: immich
          - name: POSTGRES_DB
            value: immich
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: immich-secrets
                key: DB_PASSWORD
          - name: POSTGRES_INITDB_ARGS
            value: "--data-checksums"
        volumeMounts:
          - name: local-data
            mountPath: /var/lib/postgresql/data
            subPath: postgres
