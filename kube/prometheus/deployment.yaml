apiVersion: apps/v1
kind: Deployment
metadata:
   name: prometheus-deployment
   labels:
      app: prometheus
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
      matchLabels:
        app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus-sa
      volumes:
        - name: "prometheus-storage"
          persistentVolumeClaim:
            claimName: prometheus-pv-claim
        - name: "prometheus-config"
          configMap:
            defaultMode: 420
            name: prometheus-server-conf
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.4
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
          ports:
            - containerPort: 9090
              protocol: TCP
          volumeMounts:
            - name: prometheus-storage
              mountPath: /prometheus
            - name: prometheus-config
              mountPath: /etc/prometheus/