apiVersion: apps/v1
kind: Deployment
metadata:
   name: twingate-deployment
   labels:
      app: twingate
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
      matchLabels:
        app: twingate
  template:
    metadata:
      labels:
        app: twingate
    spec:
      containers:
      - name: twingate
        image: twingate/connector:1.89.0
        env:
        - name: TWINGATE_NETWORK
          valueFrom:
            secretKeyRef:
              name: twingate-connector-data
              key: network
        - name: TWINGATE_ACCESS_TOKEN
          valueFrom:
            secretKeyRef:
              name: twingate-connector-data
              key: access_token
        - name: TWINGATE_REFRESH_TOKEN
          valueFrom:
            secretKeyRef:
              name: twingate-connector-data
              key: refresh_token
