apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: actual
spec:
  entryPoints:
    - websecure
  tls:
    certResolver: cloudflare
  routes:
    - match: Host(`actual.lazyduck.fr`)
      kind: Rule
      services:
        - name: actual
          port: 5006
      middlewares:
        - name: internal-only
          namespace: kube-system
