apiVersion: apps/v1
kind: Deployment
metadata:
   name: actual-deployment
   labels:
      app: actual
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
      matchLabels:
        app: actual
  template:
    metadata:
      labels:
        app: actual
    spec:
      volumes:
      - name: "actual-storage"
        persistentVolumeClaim:
          claimName: actual-pv-claim
      containers:
      - name: actual
        image: actualbudget/actual-server:26.9.0@sha256:552beab3dec8c93d46b8b9245612d63c3f123b8a45063a474f53e229b17621d3
        resources:
          requests:
            cpu: "20m"
            memory: "128Mi"
        ports:
          - containerPort: 5006
            protocol: TCP
        env:
          - name: DEBUG
            value: 'actuel:config'
          - name: ACTUAL_PORT
            value: "5006"
        volumeMounts:
          - name: actual-storage
            mountPath: /data
        livenessProbe:
          exec:
            command:
              - node
              - src/scripts/health-check.js
          initialDelaySeconds: 20
          periodSeconds: 60
          timeoutSeconds: 10
          failureThreshold: 3
