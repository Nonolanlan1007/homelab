apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openbao
  namespace: argocd
spec:
  project: homelab
  sources:
    - chart: openbao
      repoURL: https://openbao.github.io/openbao-helm
      targetRevision: 0.30.6
      helm:
        releaseName: openbao
        valueFiles:
          - $basedir/values.yaml
    - repoURL: https://gitea.lazyduck.fr/nolhan/homelab
      targetRevision: HEAD
      ref: basedir
      path: kube/openbao
      directory:
        include: ingress-route.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default