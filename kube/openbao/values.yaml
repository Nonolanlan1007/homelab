server:
  standalone:
    enabled: true
    config: |
      ui = true
      
      listener "tcp" {
        tls_disable = 1
        address = "[::]:8200"
        cluster_address = "[::]:8201"
      }
      storage "pebbledb" {
        path = "/openbao/data"
      }

  dataStorage:
    size: 10Gi
    storageClass: 'local-path-retain'

  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi