apiVersion: apps/v1
kind: Deployment
metadata:
   name: jellyfin-deployment
   labels:
      app: jellyfin
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
      matchLabels:
        app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      volumes:
        - name: "config-storage"
          persistentVolumeClaim:
            claimName: jellyfin-config-pv-claim
        - name: "medias-storage"
          persistentVolumeClaim:
            claimName: jellyfin-medias-pv-claim
      containers:
      - name: jellyfin
        image: jellyfin/jellyfin:10.11.11@sha256:aefb67e6a7ff1debdd154a78a7bbb780fd0c873d8639210a7f6a2016ad2b35db
        resources:
          requests:
            cpu: "20m"
            memory: "512Mi"
        ports:
          - containerPort: 8096
            protocol: TCP
          - containerPort: 1900
            protocol: UDP
          - containerPort: 7359
            protocol: UDP
        volumeMounts:
          - name: config-storage
            mountPath: /config
            subPath: config
          - name: config-storage
            mountPath: /cache
            subPath: cache
          - name: medias-storage
            mountPath: /media