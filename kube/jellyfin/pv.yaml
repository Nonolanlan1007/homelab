apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-medias-pv
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - hard
    - nfsvers=4.1
  nfs:
    path: /volume1/JellyfinMedias
    server: 10.0.0.122