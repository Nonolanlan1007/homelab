apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: vaultwarden
spec:
  entryPoints:
    - websecure
  tls:
    certResolver: cloudflare
  routes:
    - match: Host(`vaultwarden.lazyduck.fr`)
      kind: Rule
      services:
        - name: vaultwarden
          port: 80
      middlewares:
        - name: internal-only
          namespace: kube-system
