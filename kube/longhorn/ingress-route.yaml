apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  entryPoints:
    - websecure
  tls:
    certResolver: cloudflare
  routes:
    - match: Host(`longhorn.lazyduck.fr`)
      kind: Rule
      services:
        - name: longhorn-frontend
          port: 80
      middlewares:
        - name: internal-only
          namespace: kube-system
