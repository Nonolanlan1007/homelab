apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbittorrent-pv-claim
spec:
  storageClassName: longhorn-retain
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbittorrent-downloads-pv-claim
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: 5Gi
  volumeName: qbittorrent-downloads-pv
