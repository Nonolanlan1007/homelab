apiVersion: v1
kind: Pod
metadata:
  name: authentik-storage-helper
spec:
  containers:
  - name: helper
    image: alpine:latest
    command: ["/bin/sh", "-c", "sleep 3600"]
    volumeMounts:
    - name: data
      mountPath: /data
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: authentik-pv-claim
