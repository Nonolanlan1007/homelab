apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik
  labels:
    app: authentik
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authentik
  template:
    metadata:
      labels:
        app: authentik
    spec:
      containers:
      - name: postgresql
        image: docker.io/library/postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        resources:
          requests:
            cpu: "20m"
            memory: "128Mi"
        envFrom:
        - secretRef:
            name: authentik-secrets
        env:
        - name: POSTGRES_DB
          value: "authentik"
        - name: POSTGRES_USER
          value: "authentik"
        volumeMounts:
        - name: storage
          mountPath: /var/lib/postgresql/data
          subPath: postgresql

      - name: redis
        image: docker.io/library/redis:alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
        command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
        resources:
          requests:
            cpu: "20m"
            memory: "128Mi"
        volumeMounts:
        - name: storage
          mountPath: /data
          subPath: redis

      - name: server
        image: ghcr.io/goauthentik/server:2026.8.2@sha256:ff8489a5af4f4fe415ffd180a8e3c10b120bc2592d13d79dac050d977f7b9ecd
        args: ["server"]
        resources:
          requests:
            cpu: "20m"
            memory: "256Mi"
        envFrom:
        - secretRef:
            name: authentik-secrets
        env:
        - name: AUTHENTIK_POSTGRESQL__HOST
          value: "localhost"
        - name: AUTHENTIK_POSTGRESQL__NAME
          value: "authentik"
        - name: AUTHENTIK_POSTGRESQL__USER
          value: "authentik"
        - name: AUTHENTIK_REDIS__HOST
          value: "localhost"
        ports:
        - containerPort: 9000
        - containerPort: 9443
        volumeMounts:
        - name: storage
          mountPath: /media
          subPath: media
        - name: storage
          mountPath: /templates
          subPath: templates

      - name: worker
        image: ghcr.io/goauthentik/server:2026.8.2@sha256:ff8489a5af4f4fe415ffd180a8e3c10b120bc2592d13d79dac050d977f7b9ecd
        args: ["worker"]
        resources:
          requests:
            cpu: "20m"
            memory: "128Mi"
        envFrom:
        - secretRef:
            name: authentik-secrets
        env:
        - name: AUTHENTIK_POSTGRESQL__HOST
          value: "localhost"
        - name: AUTHENTIK_POSTGRESQL__NAME
          value: "authentik"
        - name: AUTHENTIK_POSTGRESQL__USER
          value: "authentik"
        - name: AUTHENTIK_REDIS__HOST
          value: "localhost"
        volumeMounts:
        - name: storage
          mountPath: /media
          subPath: media
        - name: storage
          mountPath: /certs
          subPath: certs
        - name: storage
          mountPath: /templates
          subPath: templates
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: authentik-pv-claim
