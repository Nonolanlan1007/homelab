apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitea.lazyduck.fr/nolhan/homelab
    targetRevision: HEAD
    path: argocd
    directory:
      recurse: true
      exclude: bootstrap/**
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      selfHeal: true
      prune: true