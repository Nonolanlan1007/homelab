apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: homelab
  namespace: argocd
spec:
  description: The best homelab ever created (except for the PNY drive silently dying)
  sourceRepos:
    - https://gitea.lazyduck.fr/nolhan/homelab
    - https://openbao.github.io/openbao-helm
    - https://charts.external-secrets.io
  destinations:
    - name: in-cluster
      namespace: '*'
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
