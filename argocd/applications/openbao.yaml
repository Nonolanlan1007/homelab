apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openbao
  namespace: argocd
spec:
  project: homelab
  sources:
    - chart: openbao
      repoURL: https://openbao.github.io/openbao-helm
      targetRevision: 0.30.6
      helm:
        releaseName: openbao
        valueFiles:
          - $repo/platform/openbao/values.yaml
    - repoURL: https://gitea.lazyduck.fr/nolhan/homelab
      targetRevision: HEAD
      ref: repo
      path: platform/openbao
      directory:
        include: ingress-route.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle