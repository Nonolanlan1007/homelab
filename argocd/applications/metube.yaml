apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metube
  namespace: argocd
spec:
  project: homelab
  source:
    repoURL: https://gitea.lazyduck.fr/nolhan/homelab
    targetRevision: HEAD
    path: apps/metube
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
