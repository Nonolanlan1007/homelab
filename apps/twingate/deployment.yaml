apiVersion: apps/v1
kind: Deployment
metadata:
   name: twingate-deployment
   labels:
      app: twingate
spec:
  replicas: 1
  selector:
      matchLabels:
        app: twingate
  template:
    metadata:
      labels:
        app: twingate
    spec:
      containers:
      - name: twingate
        image: twingate/connector:1.93.0
        resources:
          requests:
            cpu: "20m"
            memory: "64Mi"
        env:
        - name: TWINGATE_NETWORK
          valueFrom:
            secretKeyRef:
              name: twingate
              key: network
        - name: TWINGATE_ACCESS_TOKEN
          valueFrom:
            secretKeyRef:
              name: twingate
              key: access_token
        - name: TWINGATE_REFRESH_TOKEN
          valueFrom:
            secretKeyRef:
              name: twingate
              key: refresh_token
