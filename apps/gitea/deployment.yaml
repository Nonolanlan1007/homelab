apiVersion: apps/v1
kind: Deployment
metadata:
   name: gitea-deployment
   labels:
      app: gitea
spec:
  replicas: 1
  selector:
      matchLabels:
        app: gitea
  template:
    metadata:
      labels:
        app: gitea
    spec:
      volumes:
        - name: gitea-db
          persistentVolumeClaim:
            claimName: gitea-db-pvc
        - name: gitea-data
          persistentVolumeClaim:
            claimName: gitea-data-pvc
      containers:
      - name: gitea
        image: docker.gitea.com/gitea:1.27.3
        resources:
          requests:
            cpu: "20m"
            memory: "128Mi"
        ports:
          - containerPort: 3000
            protocol: TCP
          - containerPort: 22
            protocol: TCP
        env:
          - name: USER_UID
            value: '33'
          - name: USER_GID
            value: '33'
          - name: GITEA__database__DB_TYPE
            value: postgres
          - name: GITEA__database__HOST
            value: 'localhost:5432'
          - name: GITEA__database__NAME
            valueFrom:
              secretKeyRef:
                name: gitea-secrets
                key: POSTGRES_DB
          - name: GITEA__database__USER
            valueFrom:
              secretKeyRef:
                name: gitea-secrets
                key: POSTGRES_USER
          - name: GITEA__database__PASSWD
            valueFrom:
              secretKeyRef:
                name: gitea-secrets
                key: POSTGRES_PASSWORD
        volumeMounts:
          - name: gitea-data
            mountPath: /data

      - name: db
        image: docker.io/library/postgres:14
        resources:
          requests:
            cpu: "20m"
            memory: "128Mi"
        envFrom:
          - secretRef:
              name: gitea-secrets
        volumeMounts:
           - name: gitea-db
             mountPath: /var/lib/postgresql/data