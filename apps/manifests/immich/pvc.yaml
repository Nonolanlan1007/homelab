apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-local-pv-claim
spec:
  storageClassName: local-path-retain
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 15Gi

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library-pv-claim
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: 100Gi
  volumeName: immich-library-pv
