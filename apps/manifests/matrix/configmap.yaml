apiVersion: v1
kind: ConfigMap
metadata:
  name: matrix-well-known-config
data:
  default.conf: |
    server {
        listen 8080;
        location /.well-known/matrix/client {
            default_type application/json;
            add_header Access-Control-Allow-Origin * always;
            return 200 '{ "m.homeserver": { "base_url": "https://matrix.lazyduck.fr" }, "m.identity_server": { "base_url": "https://vector.im" } }';
        }
        location /.well-known/matrix/server {
            default_type application/json;
            add_header Access-Control-Allow-Origin * always;
            return 200 '{ "m.server": "matrix.lazyduck.fr:443" }';
        }
    }
