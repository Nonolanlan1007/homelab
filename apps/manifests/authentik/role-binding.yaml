apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: authentik
rules:
- apiGroups: [""]
  resources: ["secrets", "services"]
  verbs: ["get", "list", "create", "patch", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: authentik
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: authentik
subjects:
- kind: ServiceAccount
  namespace: default
  name: authentik-sa
