apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: authentik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`sso.lazyduck.fr`)
      kind: Rule
      services:
        - name: authentik
          port: 9443
          serversTransport: insecure-skip-verify
  tls:
    certResolver: cloudflare
