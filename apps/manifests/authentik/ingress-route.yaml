apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: authentik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`sso.lazyduck.fr`)
      kind: Rule
      services:
        - name: authentik
          port: 9443
          serversTransport: insecure-skip-verify
  tls:
    certResolver: cloudflare
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: authentik-ldap
spec:
  entryPoints:
    - ldaps
  routes:
    - match: HostSNI(`ldap.lazyduck.fr`)
      middlewares:
        - name: internal-only-tcp
          namespace: kube-system
      services:
        - name: ak-outpost-ldap
          port: 389
  tls:
    certResolver: cloudflare
