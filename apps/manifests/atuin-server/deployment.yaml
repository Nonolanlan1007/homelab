apiVersion: apps/v1
kind: Deployment
metadata:
  name: atuin-server
  labels:
    app: atuin-server
spec:
  replicas: 1
  strategy: 
    type: Recreate
  selector:
    matchLabels:
      app: atuin-server
  template:
    metadata:
      labels:
        app: atuin-server
    spec:
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: atuin-server-data
      containers:
        - name: postgresql
          image: postgres:14
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: atuin
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: atuin-server-secrets
                  key: ATUIN_DB_PASSWORD
                  optional: false
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: atuin-server-secrets
                  key: ATUIN_DB_USERNAME
                  optional: false
          lifecycle:
            preStop:
              exec:
                # This ensures graceful shutdown see: https://stackoverflow.com/a/75829325/3437018
                # Potentially consider using a `StatefulSet` instead of a `Deployment`
                command: ["pg_ctl", "stop", "-D", "/var/lib/postgresql/data", "-w", "-t", "60", "-m", "fast"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data/
              subPath: database
        - name: atuin
          image: ghcr.io/atuinsh/atuin:18.25.1
          args:
            - start
          envFrom:
            - secretRef:
                name: atuin-server-secrets
          ports:
            - containerPort: 8888
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
            requests:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /config
              subPath: server
              
