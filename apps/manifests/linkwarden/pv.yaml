apiVersion: v1
kind: PersistentVolume
metadata:
  name: linkwarden-data-pv
spec:
  capacity:
    storage: 20Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - hard
    - nfsvers=4.1
  nfs:
    path: /volume1/Data/linkwarden-data
    server: 10.0.10.122
