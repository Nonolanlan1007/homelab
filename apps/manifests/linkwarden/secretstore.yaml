apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: linkwarden-secretstore
spec:
  provider:
    vault:
      server: "http://openbao.default.svc:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "linkwarden"
          serviceAccountRef:
            name: linkwarden-sa
