apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: linkwarden-local-pv-claim
spec:
  storageClassName: local-path-retain
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 7Gi

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: linkwarden-data-pv-claim
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: 20Gi
  volumeName: linkwarden-data-pv
