apiVersion: v1
kind: PersistentVolume
metadata:
  name: paperless-documents-pv
spec:
  capacity:
    storage: 20Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - hard
    - nfsvers=4.1
  nfs:
    path: /volume1/Data/paperless-documents
    server: 10.0.10.122
