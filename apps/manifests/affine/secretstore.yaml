apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: affine-secretstore
spec:
  provider:
    vault:
      server: "http://openbao.default.svc:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "affine"
          serviceAccountRef:
            name: affine-sa
