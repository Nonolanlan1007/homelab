apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: prowlarr
spec:
  entryPoints:
    - websecure
  tls:
    certResolver: cloudflare
  routes:
    - match: Host(`prowlarr.lazyduck.fr`)
      kind: Rule
      services:
        - name: prowlarr
          port: 9696
      middlewares:
        - name: internal-only
          namespace: kube-system