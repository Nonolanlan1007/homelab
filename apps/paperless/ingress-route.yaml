apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: paperless
spec:
  entryPoints:
    - websecure
  tls:
    certResolver: cloudflare
  routes:
    - match: Host(`paperless.lazyduck.fr`)
      kind: Rule
      services:
        - name: paperless
          port: 8000
      middlewares:
        - name: internal-only
          namespace: kube-system
