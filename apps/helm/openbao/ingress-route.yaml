apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: openbao
spec:
  entryPoints:
    - websecure
  tls:
    certResolver: cloudflare
  routes:
    - match: Host(`openbao.lazyduck.fr`)
      kind: Rule
      services:
        - name: openbao
          port: 8200
      middlewares:
        - name: internal-only
          namespace: kube-system
