autoSync: false
namespace: default
source:
  chart: openbao
  repoURL: https://openbao.github.io/openbao-helm
  targetRevision: 0.30.6
  helm:
    releaseName: openbao
    valueFiles:
    - $repo/apps/helm/openbao/values.yaml
ignoreDifferences:
- group: admissionregistration.k8s.io
  kind: MutatingWebhookConfiguration
  jqPathExpressions:
  - .webhooks[]?.clientConfig.caBundle
