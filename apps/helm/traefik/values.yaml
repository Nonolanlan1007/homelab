ingressRoute:
  dashboard:
    enabled: true
    matchRule: Host(`traefik.lazyduck.fr`)
    entryPoints:
      - websecure
    tls:
      certResolver: cloudflare
    middlewares:
      - name: internal-only
        namespace: kube-system

ports:
  dns:
    port: 1053
    exposedPort: 53
    protocol: UDP
    expose:
      default: true
  web:
    proxyProtocol:
      trustedIPs:
        - 10.0.2.67/32
  websecure:
    proxyProtocol:
      trustedIPs:
        - 10.0.2.67/32
    transport:
      respondingTimeouts:
        readTimeout: 600s
        writeTimeout: 600s
        idleTimeout: 600s

providers:
  kubernetesCRD:
    allowCrossNamespace: true

certificatesResolvers:
  cloudflare:
    acme:
      email: nolhan.dev@gmail.com
      storage: /data/acme.json
      caServer: https://acme-v02.api.letsencrypt.org/directory
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - "1.1.1.1:53"
          - "1.0.0.1:53"

env:
  - name: CF_DNS_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: traefik-secrets
        key: cf-token

persistence:
  enabled: true
  path: /data
  size: 128Mi
  storageClass: local-path-retain

service:
  spec:
    externalTrafficPolicy: Local

additionalArguments:
  - --entryPoints.web.http.redirections.entryPoint.to=websecure
  - --entryPoints.web.http.redirections.entryPoint.scheme=https
  - --entryPoints.web.http.redirections.entryPoint.permanent=true