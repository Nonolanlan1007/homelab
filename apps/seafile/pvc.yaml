apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seafile-mysql-pv-claim
spec:
  storageClassName: local-path-retain
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seafile-data-pv-claim
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: 100Gi
  volumeName: seafile-data-pv

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seadoc-data-pv-claim
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: 5Gi
  volumeName: seadoc-data-pv
