apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: qbittorrent
spec:
  entryPoints:
    - websecure
  tls:
    certResolver: cloudflare
  routes:
    - match: Host(`qbittorrent.lazyduck.fr`)
      kind: Rule
      services:
        - name: qbittorrent
          port: 8080
      middlewares:
        - name: internal-only
          namespace: kube-system
