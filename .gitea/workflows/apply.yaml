name: Apply k3s files

on:
  push:
    branches:
      - main

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5

      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}

      - name: Apply changed manifests
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"
          EMPTY_TREE="4b825dc642cb6eb9a060e54bf8d69288fbee4904"

          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="$EMPTY_TREE"
          fi

          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMR "$BEFORE" "$AFTER" -- kube/ \
            | grep -E '\.ya?ml$' \
            | grep -v '/secrets\.yaml$' || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "No kube manifest changes to apply."
            exit 0
          fi

          echo "Applying:"
          echo "$CHANGED_FILES"
          echo "$CHANGED_FILES" | sed 's/^/-f /' | xargs kubectl apply
